# Netlify 배포 설정
# 홈페이지에 필요한 파일만 dist 폴더로 복사해서 그 폴더만 공개합니다.
# - 저장소의 다른 폴더(카카오톡 대화내용, 로블록스 등)는 배포되지 않습니다.
# - connect 안의 사업 문서(*.md), DB·시험 파일(supabase/), 스크린샷도 배포되지 않습니다.
# 새 화면 파일을 추가하면 아래 cp 목록에 넣어 주세요.
[build]
  publish = "dist"
  command = """
    rm -rf dist && mkdir -p dist &&
    cp connect/*.html connect/manifest.webmanifest connect/sw.js dist/ &&
    cp -r connect/css connect/js connect/vendor connect/icons dist/
  """
