<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | 윈-윈 커넥트</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script src="js/launch.js"></script>
</head>
<body class="rp-body">
<header class="nav" id="nav"></header>
<main class="page">
  <div class="wrap" style="max-width:1280px">
    <div class="page-head"><div><h1>관리자</h1><p>입금 확인 → 응답 확인·대리 입력 → 선정·리스트 전달 → 이의 처리 → 확정</p></div></div>
    <div class="tabbar" id="tabs">
      <button data-t="req" class="on">의뢰</button><button data-t="sup">공급자</button><button data-t="off">비회원사</button><button data-t="dis">이의신청</button><button data-t="price">요금 설정</button>
    </div>
    <div id="body"><p class="muted">불러오는 중…</p></div>
  </div>
</main>
<footer class="foot" id="foot"></footer>

<script>
(async function () {
  const { sb, S, esc, won, num, range, date, $, $$, toast, errMsg, catalog, requiredItems, requireLogin, reqStatus, badge, ans, rangeMark, signedUrl, SIDO } = APP;
  const me = await requireLogin(["admin"]);
  if (!me) return;
  const cat = await catalog();
  let tab = "req";
  $("#tabs").onclick = (e) => { const b = e.target.closest("[data-t]"); if (!b) return; tab = b.dataset.t; $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); show(); };
  const show = () => ({ req: tabReq, sup: tabSup, off: tabOff, dis: tabDis, price: tabPrice })[tab]();
  const call = async (p, okMsg) => { const { error } = await p; if (error) { toast(errMsg(error), "err"); return false; } if (okMsg) toast(okMsg); return true; };

  // ======================= 의뢰 =======================
  let reqs = [], reqFilter = "action", curReq = null;
  const needsAction = (r) => (r.status === "draft" && r.submitted_at) || ["open", "selecting", "disputed", "awaiting_deposit"].includes(r.status) || (r.status === "delivered" && new Date(r.verify_until) < new Date());
  async function tabReq() {
    const { data, error } = await sb.from("requests").select("*").order("created_at", { ascending: false });
    if (tab !== "req") return;
    if (error) return ($("#body").innerHTML = `<p class="muted">${esc(errMsg(error))}</p>`);
    reqs = data;
    const shown = reqs.filter((r) => reqFilter === "all" || (reqFilter === "action" ? needsAction(r) : reqStatus(r)[0] === reqFilter));
    $("#body").innerHTML = `
      <div class="tabbar" id="rf">${[["action", "처리 필요"], ["all", "전체"], ["입금 대기", "접수비 대기"], ["착수금 입금 대기", "착수금 대기"], ["공급자 응답 받는 중", "응답 중"], ["리스트 전달 · 검증 중", "검증 중"], ["이의 처리 중", "이의"], ["확정", "확정"]]
        .map(([k, l]) => `<button data-f="${k}" class="${reqFilter === k ? "on" : ""}">${l} ${reqs.filter((r) => k === "all" || (k === "action" ? needsAction(r) : reqStatus(r)[0] === k)).length}</button>`).join("")}</div>
      <div class="split"><div class="rows" id="rl">${shown.map((r) => `
        <button class="row-card ${curReq === r.id ? "on" : ""}" data-id="${r.id}"><div class="row-top">${badge(reqStatus(r))}<span class="muted">${esc(r.code || "작성 중")}</span><span class="right muted">${date(r.created_at)}</span></div>
          <b>${esc(r.title)}</b><div class="row-meta">${r.stage ? `<span>${esc((LAUNCH.PHASES.find((p) => p.id === r.phase) || {}).label || "")} · ${esc(LAUNCH.STAGE_NAME[r.stage] || "")}</span>` : ""}<span>${esc(cat.catName(r.major_id))}</span><span>${r.fee_type === "followup" ? "기존 파트너 문의" : r.kind === "direct" ? "지정" : "일반"} · ${r.supplier_count}곳</span>${r.amount_total ? `<span>${won(r.amount_total)}</span>` : ""}</div></button>`).join("") || '<div class="panel muted">해당하는 의뢰가 없습니다.</div>'}</div>
        <div id="rd"><div class="panel muted">의뢰를 고르세요.</div></div></div>`;
    $("#rf").onclick = (e) => { const b = e.target.closest("[data-f]"); if (b) { reqFilter = b.dataset.f; tabReq(); } };
    $("#rl").onclick = (e) => { const b = e.target.closest("[data-id]"); if (b) { curReq = b.dataset.id; $$("#rl .row-card").forEach((x) => x.classList.toggle("on", x === b)); openReq(curReq); } };
    if (curReq && reqs.some((r) => r.id === curReq)) openReq(curReq);
  }

  async function openReq(id) {
    const r = reqs.find((x) => x.id === id);
    const d = $("#rd"); d.innerHTML = '<div class="panel muted">불러오는 중…</div>';
    const [prof, items, files, rank, resps, pays, targets] = await Promise.all([
      sb.from("profiles").select("*").eq("id", r.demander_id).maybeSingle(),
      sb.from("request_items").select("*").eq("request_id", id),
      sb.from("request_files").select("*").eq("request_id", id).order("sort"),
      sb.rpc("rank_responses", { p_request: id }),
      sb.from("responses").select("*").eq("request_id", id),
      sb.from("payments").select("*").eq("request_id", id),
      sb.from("request_targets").select("*").eq("request_id", id),
    ]);
    if (curReq !== id || tab !== "req") return;
    const p = prof.data || {};
    const itemLabel = (iid) => (cat.items.find((x) => x.id === iid) || {}).label || "";
    const allResp = resps.data || [];
    let html = `<div class="panel">
      <div class="row-top">${badge(reqStatus(r))}<span class="muted">${esc(r.code || "")}</span>${r.kind === "direct" ? '<span class="sbadge s-amber">지정 의뢰</span>' : ""}</div>
      <h2 style="margin-top:8px">${esc(r.title)}</h2>
      ${r.context ? `<div class="note info" style="margin-bottom:10px"><b>출시 프로젝트</b> ${esc(r.context)}${r.stage ? ` · ${esc((LAUNCH.PHASES.find((p) => p.id === r.phase) || {}).label || "")} ${esc(LAUNCH.STAGE_NAME[r.stage] || "")}` : ""}</div>` : ""}
      <p class="muted" style="margin:0 0 8px">요금: ${r.fee_type === "first" ? "첫 파트너 찾기" : r.fee_type === "continue" ? "이어하기" : r.fee_type === "followup" ? "기존 파트너 문의 (무료)" : "이전 방식"} · 접수 ${won(r.intake_amount ?? r.amount_total)}${r.deposit_amount ? ` · 착수금 ${won(r.deposit_amount)}${r.deposit_paid_at ? " (입금 확인)" : ""}` : ""}${r.coupon_id ? " · 쿠폰 사용" : ""}</p>
      <dl class="kv-grid">
        <div><dt>수요자</dt><dd>${esc(p.name || "")} ${p.company ? "· " + esc(p.company) : ""}</dd></div>
        <div><dt>연락처</dt><dd>${esc(p.phone || "-")}<br><span style="font-weight:400">${esc(p.email || "")}</span></dd></div>
        <div><dt>분야</dt><dd>${esc(cat.catName(r.major_id))}${r.minor_id ? " › " + esc(cat.catName(r.minor_id)) : ""}</dd></div>
        <div><dt>수량</dt><dd>${range(r.qty_min, r.qty_max, "개")}</dd></div>
        <div><dt>단가</dt><dd>${range(r.price_min, r.price_max, "원")}</dd></div>
        <div><dt>납기</dt><dd>${range(r.due_min_days, r.due_max_days, "일")}</dd></div>
        <div><dt>금액</dt><dd>${won(r.amount_total)}</dd></div>
        <div><dt>응답 마감</dt><dd>${date(r.respond_until, true)}</dd></div>
      </dl>
      ${(items.data || []).length ? `<h3>추가 조건</h3><div class="chips">${items.data.map((x) => `<span class="chip">${esc(itemLabel(x.item_id))}</span>`).join("")}</div>` : ""}
      ${r.description ? `<h3>자세한 내용</h3><p style="white-space:pre-wrap;margin:0">${esc(r.description)}</p>` : ""}
      ${(files.data || []).length ? `<h3>첨부</h3><div class="files">${files.data.map((x) => `<div class="file-row"><a class="fname" href="#" data-file="${esc(x.path)}" style="text-decoration:underline">${esc(x.file_name)}</a><span class="sbadge ${x.visibility === "all" ? "s-blue" : "s-green"}">${x.visibility === "all" ? "모두 공개" : "선정사 공개"}</span></div>`).join("")}</div>` : ""}
    </div>`;

    if (r.status === "awaiting_deposit") {
      html += `<div class="panel"><h2>착수금 입금 확인</h2><p>착수금 <b>${won(r.deposit_amount)}</b> · 선정은 끝났고, 입금이 확인되면 수요자에게 업체명·연락처가 공개되고 7일 검증기간이 시작됩니다.</p>
        <button class="btn btn-sm" id="confirmDeposit">착수금 입금 확인 → 연락처 공개</button></div>`;
    }
    if (r.status === "draft" && r.submitted_at) {
      html += `<div class="panel"><h2>${r.amount_total ? "접수비 입금 확인" : "공개 승인 (0원)"}</h2><p>${r.amount_total ? `접수 시 금액 <b>${won(r.amount_total)}</b>` : `<b>0원</b> · ${r.fee_type === "followup" ? "기존 파트너 문의" : "쿠폰 적용"}`} · 접수 ${date(r.submitted_at, true)}</p>
        ${r.coupon_id ? '<p class="muted" style="margin:0 0 8px">쿠폰 의뢰입니다. 무료 기간에는 전화로 진지한 의뢰인지 확인한 뒤 공개해 주세요.</p>' : ""}
        <div class="row2"><label class="muted">결제 방법<input id="payPg" value="bank" style="font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px"></label>
        <label class="muted">거래번호·입금자명<input id="payTid" style="font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px"></label></div>
        <button class="btn btn-sm" id="confirmPay" style="margin-top:10px">${r.amount_total ? "입금 확인 → 파트너에게 공개" : "확인 → 파트너에게 공개"}</button></div>`;
    }
    if (["open", "selecting", "awaiting_deposit", "delivered", "disputed", "confirmed"].includes(r.status)) {
      const rk = rank.data || [];
      const canSelect = ["open", "selecting"].includes(r.status);
      html += `<div class="panel"><h2>응답 순위 <span class="muted" style="font-weight:400;font-size:14px">필수 ✕ 업체는 아래로 · 적합도 70% + 신뢰도 30%</span></h2>
        ${r.kind === "direct" ? `<p class="muted" style="margin:0 0 8px">지정 공급사 ${(targets.data || []).length}곳 · 응답 대기 ${allResp.filter((x) => x.status === "invited").length}곳 (무응답·필수 불일치는 그 업체분 환불)</p>` : ""}
        ${rk.length ? `<div class="table-wrap"><table class="data"><tr>${canSelect ? "<th>선정</th>" : ""}<th>업체</th><th>적합도</th><th>신뢰도</th><th>순위점수</th><th>필수</th><th>수량</th><th>단가</th><th>납기</th><th>상태</th><th></th></tr>
          ${rk.map((x) => { const rs = allResp.find((y) => y.id === x.response_id) || {}; return `<tr>
            ${canSelect ? `<td><input type="checkbox" data-sel="${x.response_id}" ${x.has_required_x ? "" : ""}></td>` : ""}
            <td><b>${esc(x.supplier_label)}</b>${rs.offline_supplier_id ? ' <span class="sbadge s-gray">대리</span>' : ""}</td>
            <td>${x.fit_pct == null ? "-" : num(x.fit_pct) + "%"}</td><td>${x.trust ?? "-"}</td><td><b>${num(x.rank_score)}</b></td>
            <td>${x.has_required_x ? ans("X") : ans("O")}</td>
            <td>${range(rs.qty_min, rs.qty_max)} ${ans(rangeMark(r.qty_min, r.qty_max, rs.qty_min, rs.qty_max))}</td>
            <td>${range(rs.price_min, rs.price_max)} ${ans(rangeMark(r.price_min, r.price_max, rs.price_min, rs.price_max))}</td>
            <td>${range(rs.due_min_days, rs.due_max_days)} ${ans(rangeMark(r.due_min_days, r.due_max_days, rs.due_min_days, rs.due_max_days))}</td>
            <td>${esc({ invited: "응답 대기", submitted: "제출", selected: "선정", not_selected: "미선정" }[rs.status] || rs.status || "")}</td><td><button class="btn btn-sm btn-ghost" data-view="${x.response_id}">보기</button></td></tr>`; }).join("")}</table></div>` : '<p class="muted">아직 응답이 없습니다. 비회원 공급자에게 연락해 대리 입력할 수 있습니다.</p>'}
        <div id="respView"></div>
        ${canSelect ? `<div class="ctl" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          ${r.status === "open" ? '<button class="btn btn-sm btn-ghost" id="closeResp">응답 마감 (선정 중으로)</button>' : ""}
          <button class="btn btn-sm btn-ghost" id="proxyBtn">비회원 공급자 대리 입력</button>
          <button class="btn btn-sm" id="deliverBtn">선택한 업체로 리스트 전달</button></div>` : ""}
        <div id="proxyBox"></div></div>`;
    }
    if (["delivered", "disputed"].includes(r.status)) {
      html += `<div class="panel"><h2>검증기간</h2><p>리스트 전달 ${date(r.delivered_at, true)} · 검증 종료 ${date(r.verify_until, true)}</p>
        <button class="btn btn-sm" id="confirmReq">확정 처리</button> <span class="muted">처리 중인 이의신청이 없을 때만 확정됩니다. 문제없이 통과한 공급자는 신뢰도가 회복됩니다(+1).</span></div>`;
    }
    if ((pays.data || []).length) {
      const pay = pays.data[0];
      const rf = await sb.from("refunds").select("*").eq("payment_id", pay.id);
      const refunded = (rf.data || []).reduce((s, x) => s + x.amount, 0);
      html += `<div class="panel"><h2>결제·환불</h2><p>결제 ${won(pay.amount)} (${esc(pay.pg)} ${esc(pay.pg_tid || "")}) · ${date(pay.paid_at, true)} · 환불 합계 ${won(refunded)}</p>
        ${(rf.data || []).map((x) => `<p class="muted" style="margin:2px 0">${date(x.created_at)} · ${won(x.amount)} · ${esc(x.reason)}</p>`).join("")}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input id="rfAmt" type="number" placeholder="환불 금액" style="font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:140px">
          <select id="rfReason" style="font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px"><option value="no_response">지정사 무응답</option><option value="direct_mismatch">지정사 필수 불일치</option><option value="shortfall">업체 부족</option><option value="dispute">이의신청 인정</option></select>
          <button class="btn btn-sm btn-ghost" id="rfBtn" data-pay="${pay.id}">환불 기록</button></div>
        <p class="muted" style="margin:6px 0 0">업체분 환불액 = 결제금액 × (환불 업체 수 ÷ ${r.supplier_count}) = 1곳당 ${won(Math.floor(pay.amount / r.supplier_count))}. 실제 환불(카드 취소·계좌 송금)은 따로 처리하고 여기에 기록합니다.</p></div>`;
    }
    d.innerHTML = html;

    d.querySelectorAll("[data-file]").forEach((a) => (a.onclick = async (e) => { e.preventDefault(); const u = await signedUrl(a.dataset.file); if (u) window.open(u, "_blank"); }));
    const on = (sel, fn) => { const el = d.querySelector(sel); if (el) el.onclick = fn; };
    on("#confirmDeposit", async () => { if (await call(sb.rpc("admin_confirm_deposit", { p_request: id }), "착수금을 확인하고 연락처를 공개했습니다")) tabReq(); });
    on("#confirmPay", async () => { if (await call(sb.rpc("admin_confirm_payment", { p_request: id, p_pg: $("#payPg").value || "bank", p_tid: $("#payTid").value || null }), "입금 확인, 공급자에게 공개했습니다")) tabReq(); });
    on("#closeResp", async () => { if (await call(sb.from("requests").update({ status: "selecting" }).eq("id", id), "응답을 마감했습니다")) tabReq(); });
    on("#deliverBtn", async () => {
      const ids = $$("[data-sel]:checked", d).map((x) => x.dataset.sel);
      if (!ids.length) return toast("선정할 업체를 고르세요", "err");
      if (ids.length !== r.supplier_count && !confirm(`요청 업체 수는 ${r.supplier_count}곳인데 ${ids.length}곳을 골랐습니다. 이대로 전달할까요? (부족분은 환불 기록 필요)`)) return;
      if (await call(sb.rpc("admin_deliver", { p_request: id, p_selected: ids }), "리스트를 전달했습니다")) tabReq();
    });
    on("#confirmReq", async () => { if (await call(sb.rpc("admin_confirm_request", { p_request: id }), "확정했습니다")) tabReq(); });
    on("#rfBtn", async (e) => {
      const amt = +$("#rfAmt").value; if (!amt) return toast("환불 금액을 입력하세요", "err");
      if (await call(sb.from("refunds").insert({ payment_id: e.target.dataset.pay, amount: amt, reason: $("#rfReason").value }), "환불을 기록했습니다")) openReq(id);
    });
    d.querySelectorAll("[data-view]").forEach((b) => (b.onclick = () => viewResp(r, allResp.find((x) => x.id === b.dataset.view))));
    on("#proxyBtn", () => proxyForm(r, items.data || []));
  }

  async function viewResp(r, x) {
    const [a, s, o] = await Promise.all([
      sb.from("response_answers").select("*").eq("response_id", x.id),
      x.supplier_id ? sb.from("suppliers").select("*").eq("id", x.supplier_id).maybeSingle() : { data: null },
      x.offline_supplier_id ? sb.from("offline_suppliers").select("*").eq("id", x.offline_supplier_id).maybeSingle() : { data: null },
    ]);
    const sup = s.data || o.data || {};
    const itemLabel = (iid) => (cat.items.find((y) => y.id === iid) || {}).label || "";
    $("#respView").innerHTML = `<div class="panel" style="margin-top:12px;background:var(--bg-alt)">
      <h3 style="margin-top:0">${esc(sup.company_name || "")} <span class="muted" style="font-weight:400">${esc(sup.contact_name || "")} ${esc(sup.contact_phone || "")} · ${esc(sup.region_sido || "")}</span></h3>
      <ul class="rp-checks">${(a.data || []).map((y) => `<li><span class="rp-q">${esc(itemLabel(y.item_id))}${y.checked_via ? ` <span class="muted">(${esc(y.checked_via)} 확인)</span>` : ""}</span>${ans(y.value)}${y.note ? `<span class="rp-note">${esc(y.note)}</span>` : ""}</li>`).join("")}</ul>
      ${x.sample_cost ? `<p class="rp-memo"><b>샘플</b> ${esc(x.sample_cost)}</p>` : ""}${x.memo ? `<p class="rp-memo"><b>메모</b> ${esc(x.memo)}</p>` : ""}
      <p class="muted" style="margin:6px 0 0">인허가 서약 ${x.license_pledge ? "✓" : "✕"} · 제출 ${date(x.submitted_at, true)}</p></div>`;
  }

  // 비회원 공급자 대리 입력 (전화로 확인한 내용)
  function proxyForm(r, reqItems) {
    const qItems = requiredItems(cat, r.major_id).concat(cat.items.filter((x) => reqItems.some((y) => y.item_id === x.id)));
    $("#proxyBox").innerHTML = `<form class="panel form" id="pxForm" novalidate style="margin-top:12px;gap:12px;background:var(--bg-alt)">
      <h3 style="margin:0">비회원 공급자 대리 입력</h3>
      <label>등록된 비회원사에서 고르기<select name="offline_id"><option value="">새 업체로 입력</option></select></label>
      <div class="row2"><label>업체명 <i>*</i><input name="company_name" required></label><label>지역<select name="region_sido"><option value="">선택</option>${SIDO.map((s) => `<option>${s}</option>`).join("")}</select></label></div>

  function parseCSV(text) {
    const out = []; let row = [], cell = "", q = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); out.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); out.push(row); }
    return out.filter((r) => r.some((c) => c.trim()));
  }

    const state = (o) => o.linked_supplier_id ? '<span class="sbadge s-green">회원 가입함</span>' : o.consent === "refused" ? '<span class="sbadge s-red">제외 요청</span>' : o.listed ? '<span class="sbadge s-blue">공개</span>' : '<span class="sbadge s-gray">비공개</span>';
    $("#offList").innerHTML = `<p class="muted" style="margin:0 0 6px">${shown.length} / ${offs.length}곳 · 공개 ${offs.filter((o) => o.listed && o.consent !== "refused" && !o.linked_supplier_id).length}곳</p>
      <table class="data"><tr><th>업체</th><th>종류·분류</th><th>지역</th><th>연락처</th><th>출처</th><th>활동 확인</th><th>상태</th><th></th></tr>
      ${shown.map((o) => `<tr><td><b>${esc(o.company_name)}</b><br><span class="muted">${esc(o.biz_no || "사업자번호 없음")}</span></td>
        <td>${o.kinds.map((k) => `<span class="sbadge s-blue">${esc(k)}</span>`).join(" ")}<br><span class="muted">${esc((o.category_ids || []).map(catLabel).join(", "))}</span></td>
        <td>${esc(o.region_sido || "")}</td><td>${esc(o.contact_name || "")}<br>${esc(o.contact_phone || "")}</td>
        <td>${o.source === "public" ? "공공데이터" : "네트워크"}<br><span class="muted">${esc(o.source_name || "")} ${o.source_date ? date(o.source_date) : ""}</span></td>
        <td>${o.active_checked_at ? date(o.active_checked_at) : '<span class="muted">미확인</span>'}</td><td>${state(o)}</td>
        <td style="white-space:nowrap"><button class="btn btn-sm btn-ghost" data-oe="${o.id}">수정</button>
          ${!o.linked_supplier_id && o.consent !== "refused" ? `<button class="btn btn-sm btn-ghost" data-ol="${o.id}">${o.listed ? "숨기기" : "공개"}</button>` : ""}
          <button class="btn btn-sm btn-ghost" data-oa="${o.id}">오늘 활동 확인</button></td></tr>`).join("") || '<tr><td colspan="8" class="muted">등록된 업체가 없습니다.</td></tr>'}</table>`;
    $("#offList").onclick = async (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.oe) return offFormShow(offs.find((o) => o.id === b.dataset.oe));
      if (b.dataset.ol) { const o = offs.find((x) => x.id === b.dataset.ol); if (await call(sb.from("offline_suppliers").update({ listed: !o.listed, updated_at: new Date().toISOString() }).eq("id", o.id), o.listed ? "숨겼습니다" : "공개했습니다")) tabOff(); }
      if (b.dataset.oa) { if (await call(sb.from("offline_suppliers").update({ active_checked_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq("id", b.dataset.oa), "활동 확인일을 기록했습니다")) tabOff(); }
    };
  }

  function offFormShow(o) {
    offEdit = o; o = o || { source: "network", listed: true, consent: "unknown", category_ids: [], process_names: [] };
    const box = $("#offForm");
    box.innerHTML = `<form class="panel form" id="ofF" novalidate style="margin-bottom:14px;gap:12px;background:var(--bg-alt)">
      <h3 style="margin:0">${offEdit ? "비회원사 수정" : "비회원사 추가"}</h3>
      <div class="row3"><label>업체명 <i>*</i><input name="company_name" value="${esc(o.company_name || "")}"></label>
        <label>사업자번호<input name="biz_no" value="${esc(o.biz_no || "")}" placeholder="숫자 10자리"></label>
        <label>지역<select name="region_sido"><option value="">선택</option>${SIDO.map((x) => `<option ${o.region_sido === x ? "selected" : ""}>${x}</option>`).join("")}</select></label></div>
      <div class="row2"><label>담당자<input name="contact_name" value="${esc(o.contact_name || "")}"></label><label>연락처<input name="contact_phone" value="${esc(o.contact_phone || "")}"></label></div>
      <div><b style="font-size:14px">분류</b> <span class="muted">(대분류를 고르면 종류 배지가 정해집니다)</span>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;margin-top:6px">${cat.majors.map((m) => `<div>
          <label style="font-weight:700"><input type="checkbox" data-c="${m.id}" ${o.category_ids.includes(m.id) ? "checked" : ""}> ${esc(m.name)}</label>
          ${cat.minorsOf(m.id).map((x) => `<label class="muted" style="display:block;margin-left:18px;font-size:13px"><input type="checkbox" data-c="${x.id}" ${o.category_ids.includes(x.id) ? "checked" : ""}> ${esc(x.name)}</label>`).join("")}</div>`).join("")}</div></div>
      <label>공정 (쉼표로 구분)<input name="process_names" value="${esc((o.process_names || []).join(", "))}"></label>
      <label>소개 (공개됨 · 업체명·연락처는 쓰지 마세요)<textarea name="intro" rows="2">${esc(o.intro || "")}</textarea></label>
      <div class="row3"><label>출처 구분<select name="source"><option value="public" ${o.source === "public" ? "selected" : ""}>공공데이터</option><option value="network" ${o.source === "network" ? "selected" : ""}>운영사 네트워크</option></select></label>
        <label>출처명<input name="source_name" value="${esc(o.source_name || "")}" placeholder="예: 식약처 식품제조가공업 인허가"></label>
        <label>수집일<input name="source_date" type="date" value="${esc(o.source_date || "")}"></label></div>
      <div class="row3"><label>활동 확인일<input name="active_checked_at" type="date" value="${esc((o.active_checked_at || "").slice(0, 10))}"></label>
        <label>공개<select name="listed"><option value="1" ${o.listed ? "selected" : ""}>공개</option><option value="0" ${!o.listed ? "selected" : ""}>비공개</option></select></label>
        <label>업체 의사<select name="consent"><option value="unknown" ${o.consent === "unknown" ? "selected" : ""}>미확인</option><option value="agreed" ${o.consent === "agreed" ? "selected" : ""}>노출 동의</option><option value="refused" ${o.consent === "refused" ? "selected" : ""}>제외 요청</option></select></label></div>
      <label>내부 메모 (비공개)<textarea name="memo" rows="2">${esc(o.memo || "")}</textarea></label>
      <div class="row-top" style="gap:8px"><button class="btn btn-sm" type="submit">저장</button><button class="btn btn-sm btn-ghost" type="button" id="ofCancel">닫기</button></div></form>`;
    box.scrollIntoView({ behavior: "smooth", block: "start" });
    const f = $("#ofF");
    $("#ofCancel").onclick = () => (box.innerHTML = "");
    f.onsubmit = async (e) => {
      e.preventDefault();
      if (!f.company_name.value.trim()) return toast("업체명을 입력하세요", "err");
      const biz = f.biz_no.value.replace(/\D/g, "");
      if (biz && biz.length !== 10) return toast("사업자번호는 숫자 10자리입니다", "err");
      const row = { company_name: f.company_name.value.trim(), biz_no: biz || null, region_sido: f.region_sido.value || null, contact_name: f.contact_name.value || null, contact_phone: f.contact_phone.value || null,
        category_ids: $$("[data-c]", f).filter((x) => x.checked).map((x) => +x.dataset.c), process_names: f.process_names.value.split(",").map((x) => x.trim()).filter(Boolean),
        intro: f.intro.value || null, source: f.source.value, source_name: f.source_name.value || null, source_date: f.source_date.value || null,
        active_checked_at: f.active_checked_at.value || null, listed: f.listed.value === "1", consent: f.consent.value, memo: f.memo.value || null, updated_at: new Date().toISOString() };
      const ok = offEdit ? await call(sb.from("offline_suppliers").update(row).eq("id", offEdit.id), "저장했습니다")
        : await call(sb.from("offline_suppliers").insert({ ...row, created_by: me.user.id }), "추가했습니다");
      if (ok) tabOff();
    };
  }

  async function offImport(text) {
    const rows = parseCSV(text);
    if (!rows.length) return toast("내용이 없습니다", "err");
    const head = rows[0].map((h) => h.trim());
    const idx = Object.fromEntries(CSV_COLS.map((c) => [c, head.indexOf(c)]));
    if (idx["업체명"] < 0) return toast("첫 줄에 '업체명' 열이 있어야 합니다. CSV 양식을 받아 쓰세요.", "err");
    const get = (r, c) => (idx[c] >= 0 ? (r[idx[c]] || "").trim() : "");
    const byBiz = Object.fromEntries(offs.filter((o) => o.biz_no).map((o) => [o.biz_no, o]));
    const errs = []; let added = 0, updated = 0, skipped = 0;
    const now = new Date().toISOString();
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i], name = get(r, "업체명");
      if (!name) { errs.push(`${i + 1}행: 업체명 없음`); continue; }
      const biz = get(r, "사업자번호").replace(/\D/g, "");
      if (biz && biz.length !== 10) { errs.push(`${i + 1}행: 사업자번호 자리수`); continue; }
      const unknown = [];
      const ids = get(r, "분류").split(/[;|]/).filter((x) => x.trim()).map((x) => { const c = catByName(x); if (!c) unknown.push(x.trim()); return c && c.id; }).filter(Boolean);
      if (unknown.length) errs.push(`${i + 1}행: 모르는 분류 ${unknown.join(", ")} (나머지는 저장)`);
      const srcRaw = get(r, "출처구분");
      const listedRaw = get(r, "공개").toUpperCase();
      const row = { company_name: name, biz_no: biz || null, category_ids: [...new Set(ids)], process_names: get(r, "공정").split(/[;|]/).map((x) => x.trim()).filter(Boolean),
        region_sido: SIDO.find((x) => get(r, "지역").startsWith(x)) || null, intro: get(r, "소개") || null, contact_name: get(r, "담당자") || null, contact_phone: get(r, "연락처") || null,
        source: /공공|public/i.test(srcRaw) ? "public" : "network", source_name: get(r, "출처명") || null, source_date: isoDate(get(r, "수집일")),
        active_checked_at: isoDate(get(r, "활동확인일")), listed: !["N", "0", "비공개", "NO"].includes(listedRaw), updated_at: now };
      const ex = biz && byBiz[biz];
      if (ex) {
        if (ex.consent === "refused" || ex.linked_supplier_id) { delete row.listed; }
        const { error } = await sb.from("offline_suppliers").update(row).eq("id", ex.id);
        if (error) errs.push(`${i + 1}행: ${errMsg(error)}`); else updated++;
      } else {
        const { error } = await sb.from("offline_suppliers").insert({ ...row, created_by: me.user.id });
        if (error) errs.push(`${i + 1}행: ${errMsg(error)}`); else { added++; if (biz) byBiz[biz] = { id: "x" }; }
      }
    }
    await tabOff();
    $("#offForm").innerHTML = `<div class="panel" style="margin-bottom:14px"><b>CSV 반영 결과</b> 추가 ${added} · 갱신 ${updated}${skipped ? " · 건너뜀 " + skipped : ""}${errs.length ? `<ul class="muted" style="margin:8px 0 0;font-size:13px">${errs.slice(0, 50).map((x) => `<li>${esc(x)}</li>`).join("")}${errs.length > 50 ? `<li>외 ${errs.length - 50}건</li>` : ""}</ul>` : ""}</div>`;
  }

  // ======================= 요금 =======================
  async function tabPrice() {
    const { data } = await sb.from("pricing").select("*").order("key");
    if (tab !== "price") return;
    $("#body").innerHTML = `<div class="panel"><h2>요금·기준 설정</h2><p class="muted">바꾸면 홈페이지와 요청서 금액 계산에 바로 반영됩니다. 이미 접수된 의뢰 금액은 바뀌지 않습니다. 조건값별 가격은 분류 관리(추후)에서 바꿉니다.</p>
      <div class="table-wrap"><table class="data"><tr><th>항목</th><th>값</th><th></th></tr>${(data || []).map((p) => `<tr><td>${esc(p.note || p.key)}<br><span class="muted">${esc(p.key)}</span></td>
        <td><input type="number" data-k="${esc(p.key)}" value="${p.value}" style="font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:140px"></td>
        <td><button class="btn btn-sm btn-ghost" data-save="${esc(p.key)}">저장</button></td></tr>`).join("")}</table></div></div>`;
    $$("[data-save]").forEach((b) => (b.onclick = async () => {
      const v = +$(`[data-k="${b.dataset.save}"]`).value;
      await call(sb.from("pricing").update({ value: v }).eq("key", b.dataset.save), "저장했습니다");
    }));
  }

  show();
})();
</script>
</body>
</html>
