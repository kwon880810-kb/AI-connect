<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제작 파트너 센터 | 윈-윈 커넥트</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
</head>
<body class="rp-body">
<header class="nav" id="nav"></header>
<main class="page"><div class="wrap" id="root"><p class="muted">불러오는 중…</p></div></main>
<footer class="foot" id="foot"></footer>

<script>
(async function () {
  const { sb, S, esc, won, num, range, date, $, $$, toast, errMsg, catalog, requiredItems, requireLogin, loadMe, ans, rangeMark, signedUrl, SIDO } = APP;
  const root = $("#root");
  let me = await requireLogin(["supplier"]);
  if (!me) return;
  const cat = await catalog();
  const RESP = { invited: ["응답 대기", "s-amber"], submitted: ["제출함", "s-blue"], selected: ["선정됨", "s-green"], not_selected: ["미선정", "s-gray"], mismatched: ["불일치", "s-red"], no_response: ["무응답", "s-gray"], replaced: ["대체됨", "s-gray"] };
  const badgeOf = (s) => `<span class="sbadge ${RESP[s][1]}">${RESP[s][0]}</span>`;

  // 사업자등록번호 검증 (국세청 체크섬)
  function bizNoValid(v) {
    const d = v.replace(/\D/g, ""); if (d.length !== 10) return false;
    const w = [1, 3, 7, 1, 3, 7, 1, 3, 5]; let s = 0;
    for (let i = 0; i < 9; i++) s += +d[i] * w[i];
    s += Math.floor((+d[8] * 5) / 10);
    return (10 - (s % 10)) % 10 === +d[9];
  }

  // ---------- 회사 정보 입력 (가입 직후 / 내 정보) ----------
  async function profileForm(existing) {
    const [sc, sp] = existing ? await Promise.all([
      sb.from("supplier_categories").select("category_id").eq("supplier_id", me.user.id),
      sb.from("supplier_processes").select("process_id").eq("supplier_id", me.user.id),
    ]) : [{ data: [] }, { data: [] }];
    const myCats = new Set((sc.data || []).map((x) => x.category_id)), myProcs = new Set((sp.data || []).map((x) => x.process_id));
    const s = existing || { company_name: me.profile.company || "", contact_name: me.profile.name, contact_phone: me.profile.phone, contact_email: me.user.email };
    return `
      <form class="form" id="supForm" novalidate>
        <h2 style="margin:0">${existing ? "내 정보" : "제작 파트너 정보 입력"}</h2>
        ${existing ? "" : '<p class="muted" style="margin:0">사업자등록번호를 확인한 뒤 의뢰를 볼 수 있습니다. 업체명과 연락처는 선정된 의뢰의 수요자에게만 공개됩니다.</p>'}
        <div class="row2">
          <label>업체명 <i>*</i><input name="company_name" required value="${esc(s.company_name)}"></label>
          <label>사업자등록번호 <i>*</i><input name="biz_no" required inputmode="numeric" placeholder="000-00-00000" value="${esc(s.biz_no || "")}" ${existing ? "disabled" : ""}></label>
        </div>
        <div class="row2">
          <label>대표자<input name="ceo_name" value="${esc(s.ceo_name || "")}"></label>
          <label>공장 지역 (시·도) <i>*</i><select name="region_sido" required><option value="">선택</option>${SIDO.map((x) => `<option ${s.region_sido === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
        </div>
        <div class="row3">
          <label>담당자<input name="contact_name" value="${esc(s.contact_name || "")}"></label>
          <label>담당자 연락처 <i>*</i><input name="contact_phone" required type="tel" value="${esc(s.contact_phone || "")}"></label>
          <label>담당자 이메일<input name="contact_email" type="email" value="${esc(s.contact_email || "")}"></label>
        </div>
        <label>소개 <span class="hint">둘러보기에 공개됩니다. 업체명·연락처는 적지 마세요</span><textarea name="intro" rows="3" maxlength="500">${esc(s.intro || "")}</textarea></label>
        <div>
          <p class="qb-title" style="margin-bottom:6px">할 수 있는 분야 <i style="color:#e5484d;font-style:normal">*</i> <span class="hint">분야만 고르면 그 분야 의뢰 전체, 품목까지 고르면 해당 품목 위주로 보여 드립니다</span></p>
          ${cat.majors.map((m) => `
            <div style="margin-bottom:8px"><label class="check-row" style="font-weight:700"><input type="checkbox" name="cat" value="${m.id}" ${myCats.has(m.id) ? "checked" : ""}>${esc(m.name)}</label>
              <div class="chips" style="margin:6px 0 0 10px">${cat.minorsOf(m.id).map((n) => `<label class="chip"><input type="checkbox" name="cat" value="${n.id}" ${myCats.has(n.id) ? "checked" : ""} style="width:auto;margin:0">${esc(n.name)}</label>`).join("")}</div></div>`).join("")}
        </div>
        <div>
          <p class="qb-title" style="margin-bottom:6px">가능한 공정</p>
          ${cat.majors.filter((m) => cat.processes.some((p) => p.major_id === m.id)).map((m) => `
            <p class="muted" style="margin:8px 0 4px">${esc(m.name)}</p>
            <div class="chips">${cat.processes.filter((p) => p.major_id === m.id).map((p) => `<label class="chip"><input type="checkbox" name="proc" value="${p.id}" ${myProcs.has(p.id) ? "checked" : ""} style="width:auto;margin:0">${esc(p.name)}</label>`).join("")}</div>`).join("")}
        </div>
        <button class="btn btn-block btn-s" type="submit">${existing ? "저장" : "등록하고 사업자 확인 요청"}</button>
        <p class="form-msg" role="status"></p>
      </form>`;
  }

  function bindProfileForm(existing) {
    $("#supForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target, msg = f.querySelector(".form-msg");
      let bad = null;
      f.querySelectorAll("[required]:not(:disabled)").forEach((el) => { const empty = !el.value.trim(); el.classList.toggle("invalid", empty); if (empty && !bad) bad = el; });
      if (bad) { msg.textContent = "표시된 항목을 채워 주세요."; msg.className = "form-msg err"; return bad.focus(); }
      if (!existing && !bizNoValid(f.biz_no.value)) { f.biz_no.classList.add("invalid"); msg.textContent = "사업자등록번호가 올바르지 않습니다."; msg.className = "form-msg err"; return; }
      const cats = $$("input[name=cat]:checked", f).map((x) => +x.value);
      if (!cats.length) { msg.textContent = "할 수 있는 분야를 하나 이상 고르세요."; msg.className = "form-msg err"; return; }
      const row = { id: me.user.id, company_name: f.company_name.value.trim(), ceo_name: f.ceo_name.value.trim() || null, region_sido: f.region_sido.value,
        contact_name: f.contact_name.value.trim() || null, contact_phone: f.contact_phone.value.trim(), contact_email: f.contact_email.value.trim() || null, intro: f.intro.value.trim() || null };
      msg.textContent = "저장 중…"; msg.className = "form-msg";
      try {
        if (existing) { const r = await sb.from("suppliers").update(row).eq("id", me.user.id); if (r.error) throw r.error; }
        else { const r = await sb.from("suppliers").insert({ ...row, biz_no: f.biz_no.value.replace(/\D/g, "") }); if (r.error) throw r.error; }
        let r = await sb.from("supplier_categories").delete().eq("supplier_id", me.user.id); if (r.error) throw r.error;
        r = await sb.from("supplier_categories").insert(cats.map((c) => ({ supplier_id: me.user.id, category_id: c }))); if (r.error) throw r.error;
        r = await sb.from("supplier_processes").delete().eq("supplier_id", me.user.id); if (r.error) throw r.error;
        const procs = $$("input[name=proc]:checked", f).map((x) => ({ supplier_id: me.user.id, process_id: +x.value }));
        if (procs.length) { r = await sb.from("supplier_processes").insert(procs); if (r.error) throw r.error; }
        toast("저장했습니다");
        me = await loadMe(true); main();
      } catch (err) {
        msg.textContent = errMsg(err).includes("duplicate") || errMsg(err).includes("unique") ? "이미 등록된 사업자등록번호입니다." : errMsg(err); msg.className = "form-msg err";
      }
    };
  }

  // ---------- 메인 ----------
  let tab = "feed", feed = [], myCats = [], myResp = [];
  async function main() {
    if (!me.supplier) { root.innerHTML = await profileForm(null); return bindProfileForm(false); }
    if (!me.supplier.biz_verified_at) {
      root.innerHTML = `<div class="panel"><h2>사업자 확인 중입니다</h2><p class="muted" style="margin:0">확인이 끝나면 의뢰를 보고 응답할 수 있습니다. 보통 1영업일 안에 끝납니다. 문의 ${esc(S.phone)}</p></div>` + await profileForm(me.supplier);
      return bindProfileForm(true);
    }
    root.innerHTML = `
      <div class="page-head"><div><h1>제작 파트너 센터</h1><p>${esc(me.supplier.company_name)} · 아이디어를 실물로 만드는 곳 · 가입·응답·거래 수수료 모두 0원</p></div></div>
      <div class="tabbar" id="tabs">
        <button data-t="feed">새 아이디어</button><button data-t="mine">내 응답</button><button data-t="opinion">의견서 요청</button><button data-t="score">내 신뢰도</button><button data-t="info">내 정보</button>
      </div>
      <div id="tabBody"></div>`;
    $("#tabs").onclick = (e) => { const b = e.target.closest("[data-t]"); if (b) { tab = b.dataset.t; showTab(); } };
    const [f, c, r] = await Promise.all([
      sb.rpc("supplier_request_feed"),
      sb.from("supplier_categories").select("category_id").eq("supplier_id", me.user.id),
      sb.from("responses").select("*").eq("supplier_id", me.user.id),
    ]);
    feed = f.data || []; myCats = (c.data || []).map((x) => x.category_id); myResp = r.data || [];
    showTab();
  }

  function showTab() {
    $$("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab));
    ({ feed: tabFeed, mine: tabMine, opinion: tabOpinion, score: tabScore, info: tabInfo })[tab]();
  }

  const matchesMine = (r) => {
    if (!myCats.includes(r.major_id)) return false;
    const myMinors = cat.minorsOf(r.major_id).filter((m) => myCats.includes(m.id)).map((m) => m.id);
    return !r.minor_id || !myMinors.length || myMinors.includes(r.minor_id);
  };

  let onlyMine = true;
  async function tabFeed() {
    const open = feed.filter((r) => r.status === "open" && (!onlyMine || matchesMine(r) || r.kind === "direct"));
    $("#tabBody").innerHTML = `
      <label class="check" style="margin-bottom:12px"><input type="checkbox" id="onlyMine" ${onlyMine ? "checked" : ""}><span>내 분야 아이디어만 보기</span></label>
      <div class="split"><div class="rows" id="feedList">${open.length ? open.map((r) => {
        const mine = myResp.find((x) => x.request_id === r.id);
        return `<button class="row-card" data-rid="${r.id}"><div class="feed-card">
          <div class="thumb" data-thumb="${esc(r.thumbnail_path || "")}">📦</div>
          <div class="body"><div class="row-top">${r.kind === "direct" ? '<span class="sbadge s-amber">지정 의뢰</span>' : ""}${mine ? badgeOf(mine.status) : ""}<span class="muted">${esc(r.code)}</span></div>
            <b>${esc(r.title)}</b>
            <div class="row-meta"><span>${esc(cat.catName(r.major_id))}${r.minor_id ? " › " + esc(cat.catName(r.minor_id)) : ""}</span><span>수량 ${range(r.qty_min, r.qty_max, "개")}</span><span>마감 ${date(r.respond_until, true)}</span></div></div>
        </div></button>`; }).join("") : '<div class="panel muted">지금 응답할 수 있는 아이디어가 없습니다. 내 분야 아이디어가 올라오면 알려 드리겠습니다.</div>'}</div>
        <div id="feedDetail"><div class="panel muted">의뢰를 고르면 내용과 응답 양식이 보입니다.</div></div></div>`;
    $("#onlyMine").onchange = (e) => { onlyMine = e.target.checked; tabFeed(); };
    $("#feedList").onclick = (e) => { const b = e.target.closest("[data-rid]"); if (b) { $$("#feedList .row-card").forEach((x) => x.classList.toggle("on", x === b)); openRequest(b.dataset.rid); } };
    for (const t of $$("[data-thumb]")) {
      if (!t.dataset.thumb) continue;
      const u = await signedUrl(t.dataset.thumb);
      if (u) t.outerHTML = `<img class="thumb" src="${esc(u)}" alt="">`;
    }
  }

  async function openRequest(id) {
    const r = feed.find((x) => x.id === id); if (!r) return;
    const box = $("#feedDetail"); box.innerHTML = '<div class="panel muted">불러오는 중…</div>';
    sb.from("request_views").upsert({ request_id: id, supplier_id: me.user.id }, { onConflict: "request_id,supplier_id", ignoreDuplicates: true }).then(() => {});
    const [items, files] = await Promise.all([
      sb.from("request_items").select("item_id").eq("request_id", id),
      sb.from("request_files").select("*").eq("request_id", id).order("sort"),
    ]);
    let resp = myResp.find((x) => x.request_id === id) || null;
    let answers = [];
    if (resp) { const a = await sb.from("response_answers").select("*").eq("response_id", resp.id); answers = a.data || []; }
    const editable = r.status === "open" && (!resp || ["invited", "submitted"].includes(resp.status));
    const qItems = requiredItems(cat, r.major_id).concat(cat.items.filter((x) => (items.data || []).some((y) => y.item_id === x.id)));
    const aOf = (iid) => answers.find((x) => x.item_id === iid) || {};
    const v = (k) => (resp && resp[k] != null ? resp[k] : "");
    box.innerHTML = `
      <div class="panel">
        <div class="row-top">${r.kind === "direct" ? '<span class="sbadge s-amber">지정 의뢰 · 회원님에게만 온 의뢰</span>' : ""}<span class="muted">${esc(r.code)}</span></div>
        <h2 style="margin-top:8px">${esc(r.title)}</h2>
        <dl class="kv-grid">
          <div><dt>분야</dt><dd>${esc(cat.catName(r.major_id))}${r.minor_id ? " › " + esc(cat.catName(r.minor_id)) : ""}</dd></div>
          <div><dt>수량</dt><dd>${range(r.qty_min, r.qty_max, "개")}</dd></div>
          <div><dt>단가</dt><dd>${range(r.price_min, r.price_max, "원")}</dd></div>
          <div><dt>납기</dt><dd>${range(r.due_min_days, r.due_max_days, "일")}</dd></div>
          <div><dt>납품지</dt><dd>${esc(r.deliver_sido || "-")}</dd></div>
          <div><dt>샘플</dt><dd>${r.sample_needed ? "필요" : "-"}</dd></div>
        </dl>
        ${r.description ? `<h3>자세한 내용</h3><p style="white-space:pre-wrap;margin:0">${esc(r.description)}</p>` : ""}
        ${(files.data || []).length ? `<h3>첨부 파일</h3><div class="files">${files.data.map((x) => `<div class="file-row"><span>${x.is_image ? "🖼" : "📄"}</span><a class="fname" href="#" data-file="${esc(x.path)}" style="text-decoration:underline">${esc(x.file_name || "파일")}</a>${x.visibility === "selected" ? '<span class="sbadge s-green">선정사 공개</span>' : ""}</div>`).join("")}</div>` : ""}
        <p class="muted" style="margin:12px 0 0">의뢰자 정보는 공개되지 않습니다. 선정되면 의뢰자가 의뢰번호를 말하며 직접 연락합니다.</p>
      </div>
      <form class="panel form" id="respForm" novalidate style="gap:14px">
        <h2 style="margin:0">체크리스트 응답 ${resp ? badgeOf(resp.status) : ""}</h2>
        ${editable ? "" : '<div class="note">응답을 고칠 수 없는 상태입니다.</div>'}
        <div class="row3">
          <label>가능 수량 (개) <i>*</i><div class="range-in"><input name="qty_min" type="number" min="0" required value="${v("qty_min")}" placeholder="최소"><span>~</span><input name="qty_max" type="number" min="0" value="${v("qty_max")}" placeholder="최대"></div></label>
          <label>예상 단가 (원) <i>*</i><div class="range-in"><input name="price_min" type="number" min="0" required value="${v("price_min")}" placeholder="최소"><span>~</span><input name="price_max" type="number" min="0" value="${v("price_max")}" placeholder="최대"></div></label>
          <label>생산 기간 (일) <i>*</i><div class="range-in"><input name="due_min" type="number" min="0" required value="${v("due_min_days")}" placeholder="최소"><span>~</span><input name="due_max" type="number" min="0" value="${v("due_max_days")}" placeholder="최대"></div></label>
        </div>
        <div id="rangePreview" class="chips"></div>
        <label>샘플 비용·기간<input name="sample_cost" value="${esc(v("sample_cost"))}" placeholder="예: 5만 원, 1주"></label>
        <div><p class="qb-title" style="margin-bottom:4px">항목별 가능 여부 <span class="hint">▲ 조건부는 조건을 메모에 꼭 적어 주세요</span></p>
          ${qItems.map((x) => { const a = aOf(x.id); return `
            <div class="ans-edit" data-item="${x.id}"><span>${esc(x.label)} <span class="muted">${esc(x.question || "")}</span>${x.is_license ? '<span class="tag-rec">서류 제출 필요</span>' : ""}</span>
              <span class="seg">${["O", "P", "X"].map((k) => `<button type="button" data-a="${k}" class="${{ O: "a-o", P: "a-p", X: "a-x" }[k]} ${a.value === k ? "on" : ""}">${{ O: "● 가능", P: "▲ 조건부", X: "✕ 불가" }[k]}</button>`).join("")}</span>
              <input type="text" data-note placeholder="메모" value="${esc(a.note || "")}"></div>`; }).join("")}
        </div>
        <label>공장 메모 <span class="hint">아이디어 의뢰자에게 보입니다</span><textarea name="memo" rows="3" maxlength="1000">${esc(v("memo"))}</textarea></label>
        <label class="check"><input type="checkbox" name="pledge" required ${resp && resp.license_pledge ? "checked" : ""}><span>이 품목을 만드는 데 법령상 필요한 인허가를 보유하고 있으며, 응답 내용이 사실과 다르면 신뢰도가 차감되는 것에 동의합니다. <i>*</i></span></label>
        ${editable ? `<button class="btn btn-s" type="submit">${resp && resp.status === "submitted" ? "응답 수정" : "응답 제출"}</button>` : ""}
        <p class="form-msg" role="status"></p>
      </form>`;
    box.querySelectorAll("[data-file]").forEach((a) => (a.onclick = async (e) => { e.preventDefault(); const u = await signedUrl(a.dataset.file); if (u) window.open(u, "_blank"); }));
    const f = $("#respForm");
    const num0 = (n) => (f[n].value === "" ? null : Number(f[n].value));
    const preview = () => {
      $("#rangePreview").innerHTML = [["수량", r.qty_min, r.qty_max, "qty"], ["단가", r.price_min, r.price_max, "price"], ["납기", r.due_min_days, r.due_max_days, "due"]]
        .map(([l, a, b, k]) => `<span class="chip">${l} ${ans(rangeMark(a, b, num0(k + "_min"), num0(k + "_max") ?? num0(k + "_min")))}</span>`).join("") +
        '<span class="muted" style="align-self:center">의뢰 범위와 비교한 결과 (✕면 선정에서 제외됩니다)</span>';
    };
    f.addEventListener("input", preview); preview();
    f.querySelectorAll(".seg").forEach((sg) => (sg.onclick = (e) => {
      const b = e.target.closest("[data-a]"); if (!b || !editable) return;
      sg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    }));
    if (!editable) f.querySelectorAll("input,textarea").forEach((x) => (x.disabled = true));
    f.onsubmit = async (e) => {
      e.preventDefault();
      const msg = f.querySelector(".form-msg");
      let bad = null;
      ["qty_min", "price_min", "due_min", "pledge"].forEach((n) => { const el = f[n], empty = el.type === "checkbox" ? !el.checked : el.value === ""; el.classList.toggle("invalid", empty); if (empty && !bad) bad = el; });
      const rows = $$(".ans-edit", f).map((el) => ({ item_id: +el.dataset.item, value: (el.querySelector(".seg .on") || {}).dataset ? el.querySelector(".seg .on").dataset.a : null, note: el.querySelector("[data-note]").value.trim() || null }));
      const missing = rows.find((x) => !x.value), pNoNote = rows.find((x) => x.value === "P" && !x.note);
      if (bad || missing || pNoNote) { msg.textContent = bad ? "표시된 항목을 채워 주세요." : missing ? "모든 항목에 가능 여부를 골라 주세요." : "▲ 조건부 항목은 조건을 메모에 적어 주세요."; msg.className = "form-msg err"; return; }
      const body = { qty_min: num0("qty_min"), qty_max: num0("qty_max") ?? num0("qty_min"), price_min: num0("price_min"), price_max: num0("price_max") ?? num0("price_min"),
        due_min_days: num0("due_min"), due_max_days: num0("due_max") ?? num0("due_min"), sample_cost: f.sample_cost.value.trim() || null, memo: f.memo.value.trim() || null, license_pledge: true, status: "submitted" };
      msg.textContent = "저장 중…"; msg.className = "form-msg";
      try {
        let rid = resp && resp.id;
        if (rid) { const u = await sb.from("responses").update(body).eq("id", rid); if (u.error) throw u.error; }
        else { const ins = await sb.from("responses").insert({ ...body, request_id: id, supplier_id: me.user.id }).select("id").single(); if (ins.error) throw ins.error; rid = ins.data.id; }
        const up = await sb.from("response_answers").upsert(rows.map((x) => ({ ...x, response_id: rid })), { onConflict: "response_id,item_id" });
        if (up.error) throw up.error;
        const fresh = await sb.from("responses").select("*").eq("supplier_id", me.user.id);
        myResp = fresh.data || [];
        toast("응답을 저장했습니다");
        openRequest(id);
      } catch (err) { msg.textContent = errMsg(err); msg.className = "form-msg err"; }
    };
  }

  function tabMine() {
    const title = (rid) => (feed.find((x) => x.id === rid) || {}).title || "의뢰";
    const code = (rid) => (feed.find((x) => x.id === rid) || {}).code || "";
    $("#tabBody").innerHTML = myResp.length ? `<div class="rows">${myResp.slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).map((x) => `
      <div class="row-card" style="cursor:default"><div class="row-top">${badgeOf(x.status)}<span class="muted">${esc(code(x.request_id))}</span><span class="right muted">${date(x.submitted_at || x.created_at, true)}</span></div>
        <b>${esc(title(x.request_id))}</b>
        <div class="row-meta"><span>적합도 ${x.fit_pct == null ? "-" : num(x.fit_pct) + "%"}</span><span>수량 ${range(x.qty_min, x.qty_max, "개")}</span><span>단가 ${range(x.price_min, x.price_max, "원")}</span></div>
        ${x.status === "selected" ? '<p class="muted" style="margin:4px 0 0">선정되었습니다. 의뢰자가 의뢰번호를 말하며 연락할 예정입니다.</p>' : ""}
      </div>`).join("")}</div>` : '<div class="panel muted">아직 응답한 의뢰가 없습니다.</div>';
  }

  async function tabOpinion() {
    const { data } = await sb.from("disputes").select("*").order("created_at", { ascending: false });
    if (tab !== "opinion") return;
    const KIND = { required: "필수 항목 불일치", condition: "추가 조건 불일치", no_contact: "연락 두절" };
    const ST = { open: "접수", awaiting_opinion: "의견서 요청", accepted: "인정", rejected: "불인정" };
    $("#tabBody").innerHTML = (data || []).length ? `<div class="rows">${data.map((d) => {
      const resp = myResp.find((x) => x.id === d.response_id) || {};
      return `<div class="panel"><div class="row-top"><span class="sbadge ${d.status === "awaiting_opinion" ? "s-amber" : "s-gray"}">${ST[d.status]}</span><b>${esc((feed.find((x) => x.id === resp.request_id) || {}).title || "")}</b><span class="right muted">${date(d.created_at)}</span></div>
        <p style="margin:8px 0 4px"><b>${KIND[d.kind]}</b></p><p style="white-space:pre-wrap;margin:0">${esc(d.claim)}</p>
        ${d.opinion ? `<p class="muted" style="margin:8px 0 0">제출한 의견: ${esc(d.opinion)}</p>` : ""}
        ${d.status === "awaiting_opinion" && !d.opinion ? `<form class="form" data-op="${d.id}" style="padding:0;border:0;margin-top:10px"><label>의견서 <span class="hint">${d.opinion_due ? date(d.opinion_due, true) + "까지" : "3영업일 안에"}</span><textarea name="op" rows="4" required placeholder="실제 상황과 사유를 적어 주세요"></textarea></label><button class="btn btn-sm" type="submit">제출</button></form>` : ""}
      </div>`; }).join("")}</div>` : '<div class="panel muted">의견서를 요청받은 건이 없습니다.</div>';
    $$("[data-op]").forEach((fm) => (fm.onsubmit = async (e) => {
      e.preventDefault(); if (!fm.op.value.trim()) return fm.op.classList.add("invalid");
      const { error } = await sb.rpc("submit_opinion", { p_dispute: fm.dataset.op, p_text: fm.op.value.trim() });
      if (error) return toast(errMsg(error), "err");
      toast("의견서를 제출했습니다"); tabOpinion();
    }));
  }

  async function tabScore() {
    const [s, ev] = await Promise.all([sb.rpc("trust_score_of", { p_supplier: me.user.id }), sb.from("score_events").select("*").order("created_at", { ascending: false })]);
    if (tab !== "score") return;
    const score = s.data ?? 100;
    const grade = score >= 90 ? ["우수", "우선 노출"] : score >= 70 ? ["일반", ""] : score >= 50 ? ["주의", "선정 후순위"] : ["제한", "응답 제한 (소명 후 해제)"];
    const R = { required_mismatch: "필수 항목 불일치", condition_mismatch: "추가 조건 불일치", no_contact: "연락 두절", opinion_late: "의견서 미제출", clean_pass: "검증기간 통과" };
    $("#tabBody").innerHTML = `<div class="panel"><h2>내 신뢰도</h2><div class="stats"><b>${score}</b>점 · 등급 <b style="font-size:18px">${grade[0]}</b> <span class="muted">${grade[1]}</span></div>
      <p class="muted" style="margin:8px 0 0">신뢰도는 회원님과 운영자만 볼 수 있습니다. 응답이 실제와 다르면 차감되고, 검증기간을 문제없이 통과하면 회복됩니다.</p></div>
      <div class="panel"><h2>변동 기록</h2>${(ev.data || []).length ? `<table class="data"><tr><th>일자</th><th>사유</th><th>점수</th></tr>${ev.data.map((x) => `<tr><td>${date(x.created_at)}</td><td>${esc(R[x.reason] || x.reason)}</td><td>${x.delta > 0 ? "+" : ""}${x.delta}</td></tr>`).join("")}</table>` : '<p class="muted">변동이 없습니다.</p>'}</div>`;
  }

  async function tabInfo() { const h = await profileForm(me.supplier); if (tab !== "info") return; $("#tabBody").innerHTML = h; bindProfileForm(true); }

  main();
})();
</script>
</body>
</html>
