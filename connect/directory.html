<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제작 파트너 둘러보기 | 윈-윈 커넥트</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/sb.js"></script>
<script src="js/launch.js"></script>
</head>
<body class="rp-body">
<header class="nav" id="nav"></header>
<main class="page">
  <div class="wrap">
    <div class="page-head">
      <div><h1>제작 파트너 둘러보기</h1><p>내 아이디어를 만들어 줄 수 있는 곳들입니다. 업체명과 연락처는 의뢰 후 선정되면 공개됩니다.</p></div>
    </div>
    <div class="stats" id="counts" style="margin-bottom:10px"></div>
    <div class="note" style="margin-bottom:14px;font-size:13px">
      <b>회원사</b>는 가입과 사업자 확인을 마치고 직접 응답하는 파트너입니다.
      <b>비회원사</b>는 공공데이터나 운영사 네트워크를 바탕으로 미리 정리한 업체로, <b>윈-윈 커넥트와 제휴 관계가 아닙니다.</b> 의뢰가 들어오면 운영사가 전화로 가능 여부를 확인해 함께 비교해 드립니다.
      목록에서 빼기를 원하는 업체는 <a id="optout" style="text-decoration:underline"></a>로 알려 주시면 바로 반영합니다.
    </div>
    <div class="tabbar" id="kinds"></div>
    <div class="tabbar" id="members">
      <button data-m="" class="on">전체</button><button data-m="member">회원사</button><button data-m="listed">비회원사</button>
    </div>
    <div class="dir-grid" id="grid"><p class="muted">불러오는 중…</p></div>
    <div class="dir-bar" id="bar" hidden>
      <span id="barText"></span>
      <button class="btn btn-sm btn-ghost" id="clearBtn" style="background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #fff">비우기</button>
      <a class="btn btn-sm" id="directBtn" href="#">찜한 회원사에 지정 의뢰</a>
    </div>
  </div>
</main>
<footer class="foot" id="foot"></footer>

<script>
(async function () {
  const { sb, S, esc, num, $, $$, catalog } = APP;
  const L = LAUNCH;
  const cat = await catalog();
  const directOn = cat.pricing.direct_request_enabled === 1;
  $("#optout").textContent = S.email; $("#optout").href = "mailto:" + S.email + "?subject=" + encodeURIComponent("[윈-윈 커넥트] 파트너 목록 제외 요청");
  const KEY = "wwc_picks";
  let picks = [];
  try { picks = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} };
  let kind = "", member = "";

  const [dir, cnt] = await Promise.all([sb.rpc("supplier_directory"), sb.rpc("supplier_counts")]);
  if (dir.error) { $("#grid").innerHTML = '<p class="muted">불러오지 못했습니다.</p>'; return; }
  const majorOf = (id) => (cat.categories.find((c) => c.id === id) || {}).parent_id || id;
  const list = (dir.data || []).map((s) => Object.assign(s, { kinds: L.kindsOf((s.category_ids || []).map(majorOf)) }));
  const c = (cnt.data || [])[0] || { members: 0, public_listed: 0, network_listed: 0 };
  $("#counts").innerHTML = `회원사 <b>${num(c.members)}</b>곳 · 비회원사 <b>${num(Number(c.public_listed) + Number(c.network_listed))}</b>곳 <span class="muted">(공개 정보 기반 ${num(c.public_listed)} · 운영사 네트워크 ${num(c.network_listed)})</span>`;
  const kinds = L.KIND_ORDER.filter((k) => list.some((s) => s.kinds.includes(k)));
  $("#kinds").innerHTML = `<button data-k="" class="on">전체 종류</button>` + kinds.map((k) => `<button data-k="${esc(k)}">${esc(k)} ${list.filter((s) => s.kinds.includes(k)).length}</button>`).join("");

  function render() {
    picks = picks.filter((p) => list.some((s) => s.supplier_key === p && s.is_member));
    if (!directOn) picks = [];
    const shown = list.filter((s) => (!kind || s.kinds.includes(kind)) && (!member || (member === "member") === s.is_member))
      .sort((a, b) => (b.is_member - a.is_member) || (b.operator_verified - a.operator_verified));
    $("#grid").innerHTML = shown.length ? shown.map((s) => {
      const on = picks.includes(s.supplier_key);
      const minors = (s.categories || []).filter((n) => !cat.majors.some((m) => m.name === n));
      return `<div class="dir-card ${on ? "on" : ""}">
        <div class="chips">
          ${s.kinds.map((k) => `<span class="sbadge s-blue">${esc(k)}</span>`).join("")}
          <span class="chip">${esc(s.region_sido || "지역 미입력")}</span>
          ${s.is_member ? '<span class="sbadge s-green">회원사 · 사업자 확인</span>' : `<span class="sbadge s-gray">비회원사 · ${esc(s.source_label)}</span>`}
          ${!s.is_member && s.operator_verified ? '<span class="sbadge s-amber">활동 확인</span>' : ""}
        </div>
        ${minors.length ? `<div class="chips">${minors.map((m) => `<span class="chip">${esc(m)}</span>`).join("")}</div>` : ""}
        ${s.intro ? `<p style="margin:0;font-size:14px;color:var(--ink-2);white-space:pre-wrap">${esc(s.intro)}</p>` : ""}
        ${(s.processes || []).length ? `<p class="muted" style="margin:0">공정: ${esc(s.processes.slice(0, 8).join(", "))}${s.processes.length > 8 ? " 외" : ""}</p>` : ""}
        ${(s.verified_licenses || []).length ? `<div class="chips">${s.verified_licenses.map((l) => `<span class="chip" style="color:var(--green);border-color:var(--green)">✓ ${esc(l.replace(" 서류 확인", ""))}</span>`).join("")}</div>` : ""}
        <div class="row-top"><span class="muted">응답 ${num(s.response_count)}건</span>
          ${s.is_member
            ? directOn ? `<button class="btn btn-sm ${on ? "" : "btn-ghost"} right" data-pick="${s.supplier_key}">${on ? "찜함 ✓" : "찜하기"}</button>` : '<span class="right muted" style="font-size:12px">지정 의뢰 준비 중</span>'
            : '<span class="right muted" style="font-size:12px">운영사가 대신 확인</span>'}</div>
      </div>`;
    }).join("") : '<div class="panel">조건에 맞는 파트너가 아직 없습니다. 아이디어를 의뢰하시면 운영사가 직접 찾아 드립니다.</div>';
    $("#bar").hidden = !picks.length;
    $("#barText").textContent = `찜한 회원사 ${picks.length}곳`;
    $("#directBtn").href = "request.html?direct=" + picks.join(",");
  }
  $("#kinds").onclick = (e) => { const b = e.target.closest("[data-k]"); if (!b) return; kind = b.dataset.k; $$("#kinds button").forEach((x) => x.classList.toggle("on", x === b)); render(); };
  $("#members").onclick = (e) => { const b = e.target.closest("[data-m]"); if (!b) return; member = b.dataset.m; $$("#members button").forEach((x) => x.classList.toggle("on", x === b)); render(); };
  $("#grid").onclick = (e) => {
    const b = e.target.closest("[data-pick]"); if (!b) return;
    const k = b.dataset.pick;
    picks = picks.includes(k) ? picks.filter((x) => x !== k) : picks.concat(k);
    save(); render();
  };
  $("#clearBtn").onclick = () => { picks = []; save(); render(); };
  render();
})();
</script>
</body>
</html>
